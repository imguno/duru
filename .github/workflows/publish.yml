name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release commit
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the verified release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Match the tag, version and verified commit
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          import os
          import pathlib
          import subprocess
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if os.environ["RELEASE_TAG"] != "v" + project["version"]:
              raise SystemExit("Release tag must equal v plus the package version")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != os.environ["VERIFIED_SHA"]:
              raise SystemExit("Release tag moved after verification started")
          if project["name"] != "duru":
              raise SystemExit("Unexpected distribution name")
      - run: python -m pip install 'build>=1,<2' 'twine>=6,<7'
      - run: python tools/release.py --output .verification/pypi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-distributions
          include-hidden-files: true
          path: |
            .verification/pypi/*.whl
            .verification/pypi/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/duru
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-distributions
          path: dist
      - name: Publish with the configured trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
